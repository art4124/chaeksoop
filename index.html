<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#dcebdd">
  <meta name="description" content="책숲 — a simple, offline-friendly Korean reading library.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="책숲">
  <link rel="apple-touch-icon" href="./assets/icon-180.png">
  <link rel="icon" type="image/png" href="./assets/favicon-32.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <title>책숲 · Korean Reading Library</title>
</head>
<body>
  <svg class="svg-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-library" viewBox="0 0 24 24"><path d="M3 5h5v15H3zM10 3h5v17h-5zM17 6l3-1 3 14-3 1z"/></symbol>
    <symbol id="i-vocab" viewBox="0 0 24 24"><path d="M4 4h11v16H4zM7 8h5M7 12h5M17 8h3v12h-3M16 13h5"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M4.9 4.9l2.2 2.2m9.8 9.8 2.2 2.2M19.1 4.9l-2.2 2.2m-9.8 9.8-2.2 2.2"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="m14 5-7 7 7 7"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M5 3h14v18l-7-4-7 4z"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M5 9H2v6h3l6 5V4L5 9zM15 9a5 5 0 0 1 0 6M18 6a9 9 0 0 1 0 12"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 6.5C9.5 4.5 6.5 4 2 4.5v14c4.5-.5 7.5 0 10 2 2.5-2 5.5-2.5 10-2v-14c-4.5-.5-7.5 0-10 2zM12 6.5v14"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V3m0 0L7 8m5-5 5 5M4 16v4h16v-4"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v13m0 0-5-5m5 5 5-5M4 17v4h16v-4"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M13 5h6v6M19 5l-9 9M19 14v5H5V5h5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M19 5l-2 2M7 17l-2 2"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 15A8 8 0 0 1 9 4a8.5 8.5 0 1 0 11 11z"/></symbol>
  </svg>

  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#home" aria-label="책숲 home">
        <img src="./assets/icon-192.png" class="brand-bunny" alt="책숲 bunny icon">
        <div>
          <b>책숲</b>
          <small>simple korean reading</small>
        </div>
      </a>
      <button type="button" class="circle-btn" id="top-settings" data-go="settings" aria-label="Settings"><svg><use href="#i-settings"></use></svg></button>
    </header>

    <main id="screen" class="screen" tabindex="-1" aria-live="polite"></main>

    <nav class="bottom-nav" id="bottom-nav" aria-label="Main navigation"></nav>
  </div>

  <dialog id="word-dialog" class="sheet-dialog" aria-labelledby="word-heading"><div id="word-content"></div></dialog>
  <dialog id="import-dialog" class="sheet-dialog wide-dialog" aria-labelledby="import-heading">
    <form id="import-form" method="dialog" class="modal-body">
      <div class="dialog-top">
        <h2 id="import-heading">책 추가하기 <span>Add a book</span></h2>
        <button class="circle-btn" type="button" data-close-dialog="import-dialog" aria-label="Close"><svg><use href="#i-close"></use></svg></button>
      </div>
      <p class="muted">Paste a Korean story or load a plain text file. It stays only in your browser on this device.</p>
      <label>Title <input id="import-title" required maxlength="100" placeholder="예: 나의 이야기"></label>
      <label>Author (optional) <input id="import-author" maxlength="80" placeholder="Your name or the author's name"></label>
      <label>Reading level
        <select id="import-level">
          <option value="1">Level 1 · Beginner</option>
          <option value="2">Level 2 · Early elementary</option>
          <option value="3">Level 3 · Upper elementary</option>
          <option value="4">Level 4 · Longer reading</option>
        </select>
      </label>
      <label>Paste Korean text <textarea id="import-text" rows="7" maxlength="100000" placeholder="여기에 한국어 이야기를 붙여 넣으세요."></textarea></label>
      <label class="file-label">Or choose a UTF-8 .txt file <input id="import-file" type="file" accept=".txt,text/plain"></label>
      <button class="btn primary full" type="submit">Add to my library</button>
    </form>
  </dialog>

  <input type="file" id="restore-file" accept=".json,application/json" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="./stories.js"></script>
  <script src="./app.js"></script>
</body>
</html>

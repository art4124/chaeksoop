name: Generate offline Korean narration

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/generate_audio.py'
      - 'stories.js'

permissions:
  contents: write

concurrency:
  group: chaeksoop-audio
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build-time TTS tools
        run: python -m pip install --disable-pip-version-check edge-tts gTTS
      - name: Generate Korean audio clips
        run: python tools/generate_audio.py
      - name: Commit pre-generated audio to this repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          if ! git diff --cached --quiet; then
            git commit -m "Add static Korean narration files [skip ci]"
            # Preserve intervening app changes. The old workflow failed when
            # GitHub rejected a non-fast-forward push during audio generation.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep 5
            done
            echo "Could not publish Korean audio after five attempts" >&2
            exit 1
          fi
